  <rect x="560" y="72" width="148" height="52" rx="6" fill="#0a0a0a"/>
  <text x="634" y="92" fill="#ffffff" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Inference</text>
  <text x="634" y="108" fill="rgba(255,255,255,0.85)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">derived</text>

  <rect x="724" y="72" width="148" height="52" rx="6" fill="#0a0a0a"/>
