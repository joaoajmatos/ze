<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1084 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="function-claim-matrix-title function-claim-matrix-desc">
  <title id="function-claim-matrix-title">Cognitive functions vs. claim kinds they may produce</title>
  <desc id="function-claim-matrix-desc">Permission matrix mapping the seven cognitive functions — perception, memory, executive, social cognition, reflection, action, and governance — against the five claim kinds, showing which kinds each function is licensed to produce, forbidden from producing, or only retrieves and annotates without originating; the reflection-versus-fact intersection is flagged as the doctrine's load-bearing prohibition: reflection may never emit a fact.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');</style></defs>
  <rect width="100%" height="100%" fill="#f7f6f4"/>

  <!-- Header: component column -->
  <rect x="12" y="72" width="208" height="52" rx="6" fill="#ffffff" stroke="rgba(10,10,10,0.12)" stroke-width="0.8"/>
  <text x="116" y="96" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Function</text>
  <text x="116" y="112" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">vs. claim kind</text>

