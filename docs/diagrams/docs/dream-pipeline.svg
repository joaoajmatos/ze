<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dream-cycle-title dream-cycle-desc">
      <title id="dream-cycle-title">Wake-sleep memory cycle from interaction to long-term memory</title>
      <desc id="dream-cycle-desc">Cycle diagram showing the wake phase capturing episodic traces into short-term memory, which the sleep phase compresses and dreams into candidates that morning integration validates into long-term memory, looping back to inform the next wake phase via the dream journal.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6b6b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8052ff"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f7f6f4"/>

      <line x1="228" y1="164" x2="260" y2="164" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="448" y1="164" x2="480" y2="164" stroke="#8052ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="668" y1="164" x2="700" y2="164" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Sleep -> Morning Integration (vertical, same x) -->
      <line x1="564" y1="188" x2="564" y2="280" stroke="#8052ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Morning Integration -> Long-Term Memory -->
      <path d="M648,304 H700 Q708,304 708,296 V220 Q708,212 716,212 H784" fill="none" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Morning Integration -.-> Wake Phase (dashed loop back) -->
      <path d="M480,304 H160 Q152,304 152,296 V212 Q152,204 160,204 H184" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Edge labels -->
      <rect x="90" y="248" width="96" height="12" rx="2" fill="#f7f6f4"/>
      <text x="138" y="257" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">DREAM JOURNAL</text>

      <!-- Node: Wake Phase (pill, start) -->
      <rect x="40" y="140" width="188" height="48" rx="24" fill="#f7f6f4"/>
      <rect x="40" y="140" width="188" height="48" rx="24" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="134" y="161" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Wake phase</text>
      <text x="134" y="175" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">interaction + salience</text>

      <!-- Node: Short-Term Memory -->
      <rect x="260" y="140" width="188" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="260" y="140" width="188" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="354" y="161" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Short-term memory</text>
      <text x="354" y="175" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">episodic buffer</text>

      <!-- Node: Sleep Phase (focal) -->
      <rect x="480" y="140" width="188" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="480" y="140" width="188" height="48" rx="6" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="574" y="161" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Sleep phase</text>
      <text x="574" y="175" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NREM replay · REM dream · critic</text>

      <!-- Node: Long-Term Memory -->
      <rect x="700" y="140" width="188" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="700" y="140" width="188" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="794" y="161" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Long-term memory</text>
      <text x="794" y="175" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">semantic · policy · decay</text>

      <!-- Node: Morning Integration -->
      <rect x="480" y="304" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="480" y="304" width="168" height="48" rx="6" fill="rgba(10,10,10,0.02)" stroke="rgba(10,10,10,0.25)" stroke-width="1"/>
      <text x="564" y="325" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Morning integration</text>
      <text x="564" y="339" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">accept · reject · revise</text>

      <!-- Legend -->
      <line x1="40" y1="396" x2="1040" y2="396" stroke="rgba(10,10,10,0.10)" stroke-width="0.8"/>
      <text x="40" y="412" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="424" width="14" height="10" rx="2" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="60" y="432" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Offline generator (haiku → sonnet critics)</text>
      <rect x="360" y="424" width="14" height="10" rx="2" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="380" y="432" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Structural (no LLM)</text>
      <line x1="600" y1="429" x2="628" y2="429" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="636" y="432" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Informs next wake phase</text>
    </svg>