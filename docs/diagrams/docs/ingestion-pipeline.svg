<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ingestion-pipeline-title ingestion-pipeline-desc">
      <title id="ingestion-pipeline-title">Content ingestion pipeline</title>
      <desc id="ingestion-pipeline-desc">Process diagram showing raw URL, file, or text input classified, fetched, processed by content type, run through parallel extractors, archived, and finally proposed to ze-memory as facts.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6b6b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8052ff"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f7f6f4"/>

      <!-- Arrows (drawn before nodes) -->
      <line x1="152" y1="160" x2="168" y2="160" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="160" x2="296" y2="160" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="408" y1="160" x2="424" y2="160" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="536" y1="160" x2="552" y2="160" stroke="#8052ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="664" y1="160" x2="680" y2="160" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="792" y1="160" x2="808" y2="160" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Node 1: input -->
      <rect x="40" y="128" width="112" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="40" y="128" width="112" height="64" rx="6" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="96" y="163" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">URL / file / text</text>

      <!-- Node 2: ContentClassifier -->
      <rect x="168" y="128" width="112" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="168" y="128" width="112" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="224" y="150" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Content</text>
      <text x="224" y="163" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Classifier</text>
      <text x="224" y="181" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">url → mime → bytes</text>

      <!-- Node 3: Fetcher -->
      <rect x="296" y="128" width="112" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="296" y="128" width="112" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="352" y="158" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Fetcher</text>
      <text x="352" y="181" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">web·browser·ytdlp·plugin</text>

      <!-- Node 4: Processor -->
      <rect x="424" y="128" width="112" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="424" y="128" width="112" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="480" y="158" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Processor</text>
      <text x="480" y="181" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">html·pdf·audio·image·text</text>

      <!-- Node 5: Extractors (focal) -->
      <rect x="552" y="128" width="112" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="552" y="128" width="112" height="64" rx="6" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="608" y="150" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Extractors</text>
      <text x="608" y="163" fill="#6b6b6b" font-size="8" font-family="'Inter', sans-serif" text-anchor="middle">(parallel)</text>
      <text x="608" y="181" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">LLMExtractor + plugins</text>

      <!-- Node 6: IngestionStore -->
      <rect x="680" y="128" width="112" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="680" y="128" width="112" height="64" rx="6" fill="rgba(10,10,10,0.05)" stroke="#6b6b6b" stroke-width="1"/>
      <text x="736" y="150" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Ingestion</text>
      <text x="736" y="163" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Store</text>
      <text x="736" y="181" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ingested_content</text>

      <!-- Node 7: MemorySink -->
      <rect x="808" y="128" width="112" height="64" rx="24" fill="#f7f6f4"/>
      <rect x="808" y="128" width="112" height="64" rx="24" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="864" y="158" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">MemorySink</text>
      <text x="864" y="181" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">proposes facts</text>

      <!-- Legend -->
      <line x1="40" y1="248" x2="920" y2="248" stroke="rgba(10,10,10,0.10)" stroke-width="0.8"/>
      <text x="40" y="264" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="276" width="14" height="10" rx="2" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="60" y="284" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Parallel extraction (focal)</text>
      <rect x="300" y="276" width="14" height="10" rx="2" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="320" y="284" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Structural / input · output</text>
    </svg>
