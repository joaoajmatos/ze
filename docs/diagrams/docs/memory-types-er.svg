<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mem-er-title mem-er-desc">
      <title id="mem-er-title">Entity-relationship diagram of Ze's relational memory types</title>
      <desc id="mem-er-desc">ER diagram showing Entity as the central referenced type, with Fact pointing to it via subject and optional object, Fact pointing to Episode as its source, Episode mentioning entities, and Event linking to participant entities. SessionSummary, Procedure, TaskState, and ProfileFacet are standalone types with no entity foreign keys and are not shown here.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6b6b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8052ff"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f7f6f4"/>

      <!-- Relationship lines (behind boxes) -->
      <path d="M308,140 H360 Q368,140 368,148 V264 Q368,272 376,272 H460" fill="none" stroke="#8052ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M308,164 H392 Q400,164 400,172 V296 Q400,304 408,304 H460" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="178" y1="224" x2="178" y2="400" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M308,480 H400 Q408,480 408,472 V376 Q408,368 416,368 H460" fill="none" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="440" x2="680" y2="368" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Relationship labels -->
      <rect x="330" y="230" width="70" height="12" rx="2" fill="#f7f6f4"/>
      <text x="365" y="239" fill="#8052ff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SUBJECT N:1</text>
      <rect x="330" y="278" width="82" height="12" rx="2" fill="#f7f6f4"/>
      <text x="371" y="287" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">OBJECT 0..1</text>
      <rect x="140" y="300" width="76" height="12" rx="2" fill="#f7f6f4"/>
      <text x="178" y="309" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">SOURCE N:1</text>
      <rect x="330" y="418" width="90" height="12" rx="2" fill="#f7f6f4"/>
      <text x="375" y="427" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.01em">MENTIONS N:N</text>
      <rect x="680" y="392" width="106" height="12" rx="2" fill="#f7f6f4"/>
      <text x="733" y="401" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.01em">PARTICIPANTS N:N</text>

      <!-- Entity: Fact -->
      <rect x="48" y="48" width="260" height="176" rx="6" fill="#f7f6f4"/>
      <rect x="48" y="48" width="260" height="176" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="48" y="48" width="260" height="26" rx="6" fill="rgba(10,10,10,0.04)"/>
      <rect x="56" y="54" width="34" height="14" rx="2" fill="transparent" stroke="rgba(10,10,10,0.35)" stroke-width="0.8"/>
      <text x="73" y="64" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENT</text>
      <text x="100" y="65" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif">Fact</text>
      <text x="60" y="94" fill="#0a0a0a" font-size="9" font-family="'Geist Mono', monospace">#id</text>
      <text x="60" y="110" fill="#0a0a0a" font-size="9" font-family="'Geist Mono', monospace">predicate, value</text>
      <text x="60" y="126" fill="#8052ff" font-size="9" font-family="'Geist Mono', monospace">→ subject_id</text>
      <text x="60" y="142" fill="#6b6b6b" font-size="9" font-family="'Geist Mono', monospace">→ object_id (opt.)</text>
      <text x="60" y="158" fill="#0a0a0a" font-size="9" font-family="'Geist Mono', monospace">→ source_episode_id</text>
      <text x="60" y="174" fill="#0a0a0a" font-size="9" font-family="'Geist Mono', monospace">confidence, reviewed</text>
      <text x="60" y="190" fill="#0a0a0a" font-size="9" font-family="'Geist Mono', monospace">contradicted</text>
      <text x="60" y="210" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace">memory_facts</text>

      <!-- Entity: Episode -->
      <rect x="48" y="400" width="260" height="152" rx="6" fill="#f7f6f4"/>
      <rect x="48" y="400" width="260" height="152" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="48" y="400" width="260" height="26" rx="6" fill="rgba(10,10,10,0.04)"/>
      <rect x="56" y="406" width="34" height="14" rx="2" fill="transparent" stroke="rgba(10,10,10,0.35)" stroke-width="0.8"/>
      <text x="73" y="416" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENT</text>
      <text x="100" y="417" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif">Episode</text>
      <text x="60" y="446" fill="#0a0a0a" font-size="9" font-family="'Geist Mono', monospace">#id</text>
      <text x="60" y="462" fill="#0a0a0a" font-size="9" font-family="'Geist Mono', monospace">agent, session_id</text>
      <text x="60" y="478" fill="#0a0a0a" font-size="9" font-family="'Geist Mono', monospace">prompt, response</text>
      <text x="60" y="494" fill="#6b6b6b" font-size="9" font-family="'Geist Mono', monospace">→ linked_entity_ids []</text>
      <text x="60" y="510" fill="#6b6b6b" font-size="9" font-family="'Geist Mono', monospace">→ linked_fact_ids []</text>
      <text x="60" y="530" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace">memory_episodes</text>

      <!-- Entity: Entity (focal) -->
      <rect x="460" y="272" width="220" height="120" rx="6" fill="#f7f6f4"/>
      <rect x="460" y="272" width="220" height="120" rx="6" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <rect x="460" y="272" width="220" height="26" rx="6" fill="rgba(128,82,255,0.10)"/>
      <rect x="468" y="278" width="34" height="14" rx="2" fill="transparent" stroke="rgba(128,82,255,0.50)" stroke-width="0.8"/>
      <text x="485" y="288" fill="#8052ff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENT</text>
      <text x="512" y="289" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif">Entity</text>
      <text x="472" y="318" fill="#0a0a0a" font-size="9" font-family="'Geist Mono', monospace">#id</text>
      <text x="472" y="334" fill="#0a0a0a" font-size="9" font-family="'Geist Mono', monospace">entity_type</text>
      <text x="472" y="350" fill="#0a0a0a" font-size="9" font-family="'Geist Mono', monospace">canonical_name</text>
      <text x="472" y="366" fill="#0a0a0a" font-size="9" font-family="'Geist Mono', monospace">aliases []</text>
      <text x="472" y="382" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace">memory_entities</text>

      <!-- Entity: Event -->
      <rect x="800" y="400" width="280" height="152" rx="6" fill="#f7f6f4"/>
      <rect x="800" y="400" width="280" height="152" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="800" y="400" width="280" height="26" rx="6" fill="rgba(10,10,10,0.04)"/>
      <rect x="808" y="406" width="34" height="14" rx="2" fill="transparent" stroke="rgba(10,10,10,0.35)" stroke-width="0.8"/>
      <text x="825" y="416" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENT</text>
      <text x="852" y="417" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif">Event</text>
      <text x="812" y="446" fill="#0a0a0a" font-size="9" font-family="'Geist Mono', monospace">#id</text>
      <text x="812" y="462" fill="#0a0a0a" font-size="9" font-family="'Geist Mono', monospace">event_type, title</text>
      <text x="812" y="478" fill="#0a0a0a" font-size="9" font-family="'Geist Mono', monospace">start_at, end_at</text>
      <text x="812" y="494" fill="#6b6b6b" font-size="9" font-family="'Geist Mono', monospace">→ participants []</text>
      <text x="812" y="510" fill="#0a0a0a" font-size="9" font-family="'Geist Mono', monospace">outcome</text>
      <text x="812" y="530" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace">memory_events</text>

      <!-- Legend -->
      <line x1="40" y1="580" x2="1080" y2="580" stroke="rgba(10,10,10,0.10)" stroke-width="0.8"/>
      <text x="40" y="596" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="608" width="14" height="10" rx="2" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="60" y="616" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Central referenced entity</text>
      <rect x="260" y="608" width="14" height="10" rx="2" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="280" y="616" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Standard type · pgvector table</text>
      <text x="560" y="616" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif" font-style="italic">SessionSummary · Procedure · TaskState · ProfileFacet have no Entity FK — not shown</text>
    </svg>