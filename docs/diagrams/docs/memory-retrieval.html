<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ze · How memory is retrieved</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f7f6f4; --color-ink:#0a0a0a; --color-muted:#6b6b6b; --color-accent:#8052ff;
      --font-sans:'Inter',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:960px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; max-width:600px; display:block; margin:0 auto; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Ze memory retrieval</p>
    <h1>How memory is retrieved</h1>
    <svg viewBox="0 0 600 864" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="memory-retrieval-title memory-retrieval-desc">
      <title id="memory-retrieval-title">How memory is retrieved</title>
      <desc id="memory-retrieval-desc">Flowchart of the six-step fetch_context retrieval pipeline, including the config-gated NLI rerank and graph augmentation branches, from policy lookup through identity block assembly.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6b6b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8052ff"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f7f6f4"/>

      <!-- Arrows (drawn before nodes) -->
      <line x1="160" y1="96" x2="160" y2="160" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="160" y1="224" x2="160" y2="288" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="232" y1="328" x2="360" y2="328" stroke="#8052ff" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="160" y1="368" x2="160" y2="432" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M440,360 V392 Q440,400 432,400 H208 Q200,400 200,408 V432" fill="none" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="160" y1="496" x2="160" y2="560" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="232" y1="600" x2="360" y2="600" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="160" y1="640" x2="160" y2="704" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M440,632 V664 Q440,672 432,672 H208 Q200,672 200,680 V704" fill="none" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="280" y="308" width="32" height="12" rx="2" fill="#f7f6f4"/>
      <text x="296" y="317" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <rect x="168" y="394" width="30" height="12" rx="2" fill="#f7f6f4"/>
      <text x="183" y="403" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <rect x="280" y="580" width="32" height="12" rx="2" fill="#f7f6f4"/>
      <text x="296" y="589" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <rect x="168" y="666" width="30" height="12" rx="2" fill="#f7f6f4"/>
      <text x="183" y="675" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- Node 1: Policy lookup -->
      <rect x="80" y="32" width="160" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="80" y="32" width="160" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="160" y="62" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Policy lookup</text>
      <text x="160" y="85" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">DefaultPolicyRegistry</text>

      <!-- Node 2: Semantic search -->
      <rect x="80" y="160" width="160" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="80" y="160" width="160" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="160" y="190" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Semantic search</text>
      <text x="160" y="213" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">pgvector cosine · budgeted</text>

      <!-- Diamond A: NLI rerank gate (focal) -->
      <polygon points="160,288 232,328 160,368 88,328" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="160" y="324" fill="#0a0a0a" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Rerank enabled?</text>
      <text x="160" y="336" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">nli_retrieval_rerank</text>

      <!-- Node 3: Profile injection -->
      <rect x="80" y="432" width="160" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="80" y="432" width="160" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="160" y="462" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Profile injection</text>
      <text x="160" y="485" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">memory_profile_facets</text>

      <!-- Diamond B: graph augmentation gate -->
      <polygon points="160,560 232,600 160,640 88,600" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="160" y="596" fill="#0a0a0a" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Graph enabled?</text>
      <text x="160" y="608" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">default: true</text>

      <!-- Node 4: Identity block assembly -->
      <rect x="80" y="704" width="160" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="80" y="704" width="160" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="160" y="726" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Identity block</text>
      <text x="160" y="739" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">assembly</text>
      <text x="160" y="757" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">build_identity_block()</text>

      <!-- Node 5: NLI re-rank (branch) -->
      <rect x="360" y="296" width="160" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="360" y="296" width="160" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="440" y="326" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">NLI re-rank</text>
      <text x="440" y="349" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">turn1: cosine · turn2+: cached</text>

      <!-- Node 6: Graph augmentation (branch) -->
      <rect x="360" y="568" width="160" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="360" y="568" width="160" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="440" y="598" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Graph augmentation</text>
      <text x="440" y="621" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">one-hop · failures swallowed</text>

      <!-- Legend -->
      <line x1="40" y1="800" x2="560" y2="800" stroke="rgba(10,10,10,0.10)" stroke-width="0.8"/>
      <text x="40" y="816" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="828" width="14" height="10" rx="2" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="60" y="837" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Step</text>
      <polygon points="220,828 234,833 220,838 206,833" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="244" y="837" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Config-gated decision</text>
      <polygon points="420,828 434,833 420,838 406,833" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="444" y="837" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Cache-sensitive gate</text>
    </svg>
  </div>
</body>
</html>
