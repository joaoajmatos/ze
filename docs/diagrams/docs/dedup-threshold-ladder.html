<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ze · Fact dedup threshold ladder</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f7f6f4; --color-ink:#0a0a0a; --color-muted:#6b6b6b; --color-accent:#8052ff;
      --font-sans:'Inter',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:960px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:820px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Policy · Ze memory consolidation</p>
    <h1>Fact dedup threshold ladder</h1>
    <svg viewBox="0 0 960 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dedup-title dedup-desc">
      <title id="dedup-title">Fact deduplication threshold ladder from cosine similarity to consolidation action</title>
      <desc id="dedup-desc">Graduated four-band ladder showing that fact pairs above 0.95 cosine similarity are silently merged with no LLM call, pairs between 0.85 and 0.95 go through NLI entailment then an LLM merge, pairs between 0.60 and 0.85 get an NLI contradiction check only, and pairs below 0.60 are skipped entirely with no NLI call.</desc>
      <defs>
        <linearGradient id="confidence-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.04"/>
        </linearGradient>
      </defs>
      <rect width="100%" height="100%" fill="#f7f6f4"/>

      <!-- Confidence gradient rail -->
      <rect x="40" y="100" width="12" height="316" rx="4" fill="url(#confidence-grad)"/>
      <text x="46" y="90" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SIM</text>

      <!-- Band 1: > 0.95 — silent merge, no LLM -->
      <rect x="76" y="100" width="844" height="56" rx="6" fill="#f7f6f4"/>
      <rect x="76" y="100" width="844" height="56" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="92" y="112" width="112" height="32" rx="2" fill="transparent" stroke="rgba(10,10,10,0.35)" stroke-width="0.8"/>
      <text x="148" y="132" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">&gt; 0.95</text>
      <line x1="232" y1="112" x2="232" y2="144" stroke="rgba(10,10,10,0.12)" stroke-width="1"/>
      <text x="252" y="126" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif">Silent merge — keep newer, mark older contradicted</text>
      <text x="252" y="141" fill="#6b6b6b" font-size="8.5" font-family="'Geist Mono', monospace">merge_silent_threshold · no LLM call</text>

      <!-- Band 2: 0.85–0.95 — NLI + LLM merge (focal) -->
      <rect x="76" y="168" width="844" height="56" rx="6" fill="#f7f6f4"/>
      <rect x="76" y="168" width="844" height="56" rx="6" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <rect x="92" y="180" width="112" height="32" rx="2" fill="transparent" stroke="rgba(128,82,255,0.50)" stroke-width="0.8"/>
      <text x="148" y="200" fill="#8052ff" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0.85–0.95</text>
      <line x1="232" y1="180" x2="232" y2="212" stroke="rgba(128,82,255,0.30)" stroke-width="1"/>
      <text x="252" y="194" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif">NLI entailment confirms paraphrase → LLM merge (Haiku)</text>
      <text x="252" y="209" fill="#6b6b6b" font-size="8.5" font-family="'Geist Mono', monospace">merge_llm_threshold · NLI contradiction → mark older contradicted</text>

      <!-- Band 3: 0.60–0.85 — conditional NLI check -->
      <rect x="76" y="236" width="844" height="56" rx="6" fill="#f7f6f4"/>
      <rect x="76" y="236" width="844" height="56" rx="6" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <rect x="92" y="248" width="112" height="32" rx="2" fill="transparent" stroke="rgba(10,10,10,0.30)" stroke-width="0.8"/>
      <text x="148" y="268" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0.60–0.85</text>
      <line x1="232" y1="248" x2="232" y2="280" stroke="rgba(10,10,10,0.12)" stroke-width="1"/>
      <text x="252" y="262" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif">NLI contradiction ≥ threshold → mark older contradicted</text>
      <text x="252" y="277" fill="#6b6b6b" font-size="8.5" font-family="'Geist Mono', monospace">nli_contradiction_threshold · otherwise skip</text>

      <!-- Band 4: < 0.60 — no action, dashed no-op -->
      <rect x="76" y="304" width="844" height="56" rx="6" fill="#f7f6f4"/>
      <rect x="76" y="304" width="844" height="56" rx="6" fill="rgba(10,10,10,0.02)" stroke="rgba(10,10,10,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="92" y="316" width="112" height="32" rx="2" fill="transparent" stroke="rgba(10,10,10,0.20)" stroke-width="0.8"/>
      <text x="148" y="336" fill="#6b6b6b" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">&lt; 0.60</text>
      <line x1="232" y1="316" x2="232" y2="348" stroke="rgba(10,10,10,0.10)" stroke-width="1"/>
      <text x="252" y="330" fill="#6b6b6b" font-size="11" font-weight="600" font-family="'Inter', sans-serif">No action — unrelated enough to skip NLI entirely</text>
      <text x="252" y="345" fill="#6b6b6b" font-size="8.5" font-family="'Geist Mono', monospace">no NLI call</text>

      <!-- Legend -->
      <line x1="40" y1="392" x2="920" y2="392" stroke="rgba(10,10,10,0.10)" stroke-width="0.8"/>
      <text x="40" y="408" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="420" width="14" height="10" rx="2" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="60" y="428" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">LLM-involved band (Haiku merge)</text>
      <rect x="320" y="420" width="14" height="10" rx="2" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="340" y="428" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">NLI-only band</text>
      <rect x="500" y="420" width="14" height="10" rx="2" fill="rgba(10,10,10,0.02)" stroke="rgba(10,10,10,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="520" y="428" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Skipped — no check run</text>
      <text x="700" y="428" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif" font-style="italic">Reviewed facts are never auto-merged, regardless of band</text>
    </svg>
  </div>
</body>
</html>
