<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="turn-title turn-desc">
      <title id="turn-title">Full turn lifecycle through the orchestration graph</title>
      <desc id="turn-desc">Flowchart showing multimodal input preprocessed and embed-routed, either going straight to context fetch or through a decompose step for compound requests, then a capability check that executes or drafts a response or pauses for confirmation, converging on a compound check that either synthesizes or writes memory directly, ending in a response.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6b6b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8052ff"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f7f6f4"/>

      <!-- Row1 straight connectors -->
      <line x1="216" y1="144" x2="248" y2="144" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="416" y1="144" x2="448" y2="144" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="616" y1="144" x2="648" y2="144" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="816" y1="144" x2="848" y2="144" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1016" y1="144" x2="1048" y2="144" stroke="#8052ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- embed_route -> decompose (vertical, same x) -->
      <line x1="532" y1="168" x2="532" y2="248" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- decompose -> fetch_context (elbow) -->
      <path d="M616,272 V232 Q616,224 624,224 H664 Q672,224 672,216 V168" fill="none" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- capability_check -> await_confirmation (vertical, same x) -->
      <line x1="932" y1="176" x2="932" y2="248" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- await_confirmation -> execute_tool/draft_response (loop back, elbow into left edge) -->
      <path d="M1016,272 H1032 Q1040,272 1040,264 V152 Q1040,144 1048,144" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- execute_tool/draft_response -> compound? (vertical drop, same x) -->
      <line x1="1132" y1="168" x2="1132" y2="332" stroke="#8052ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- compound? -> synth+write -->
      <line x1="1048" y1="364" x2="1016" y2="364" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- synth+write -> Response -->
      <line x1="848" y1="364" x2="816" y2="364" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- edge labels -->
      <rect x="404" y="122" width="80" height="12" rx="2" fill="#f7f6f4"/>
      <text x="444" y="131" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CONFIDENT</text>
      <rect x="486" y="200" width="88" height="12" rx="2" fill="#f7f6f4"/>
      <text x="530" y="209" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">COMPOUND</text>
      <rect x="984" y="122" width="80" height="12" rx="2" fill="#f7f6f4"/>
      <text x="1024" y="131" fill="#8052ff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">EXEC/DRAFT</text>
      <rect x="900" y="204" width="66" height="12" rx="2" fill="#f7f6f4"/>
      <text x="932" y="213" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CONFIRM</text>
      <rect x="1046" y="200" width="46" height="12" rx="2" fill="#f7f6f4"/>
      <text x="1069" y="209" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">REPLY</text>

      <!-- Node: Input (start pill) -->
      <rect x="48" y="120" width="168" height="48" rx="24" fill="#f7f6f4"/>
      <rect x="48" y="120" width="168" height="48" rx="24" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="132" y="141" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Input</text>
      <text x="132" y="155" fill="#6b6b6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">text · voice · photo</text>

      <!-- Node: preprocess -->
      <rect x="248" y="120" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="248" y="120" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="332" y="149" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">preprocess</text>

      <!-- Node: embed_route -->
      <rect x="448" y="120" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="448" y="120" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="532" y="141" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">embed_route</text>
      <text x="532" y="155" fill="#6b6b6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MiniLM-L12-v2</text>

      <!-- Node: fetch_context -->
      <rect x="648" y="120" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="648" y="120" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="732" y="141" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">fetch_context</text>
      <text x="732" y="155" fill="#6b6b6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pgvector search</text>

      <!-- Node: capability_check (diamond) -->
      <polygon points="932,112 1016,144 932,176 848,144" fill="#f7f6f4"/>
      <polygon points="932,112 1016,144 932,176 848,144" fill="rgba(128,82,255,0.06)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="932" y="141" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">capability_</text>
      <text x="932" y="153" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">check</text>

      <!-- Node: execute_tool / draft_response -->
      <rect x="1048" y="120" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="1048" y="120" width="168" height="48" rx="6" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="1132" y="141" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">execute_tool /</text>
      <text x="1132" y="155" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">draft_response</text>

      <!-- Node: decompose (mini row) -->
      <rect x="448" y="248" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="448" y="248" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="532" y="269" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">decompose</text>
      <text x="532" y="283" fill="#6b6b6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claude-haiku</text>

      <!-- Node: await_confirmation (mini row, dashed) -->
      <rect x="848" y="248" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="848" y="248" width="168" height="48" rx="6" fill="rgba(10,10,10,0.02)" stroke="rgba(10,10,10,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="932" y="269" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">await_</text>
      <text x="932" y="281" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">confirmation</text>

      <!-- Node: compound? (diamond, row2) -->
      <polygon points="1132,332 1216,364 1132,396 1048,364" fill="#f7f6f4"/>
      <polygon points="1132,332 1216,364 1132,396 1048,364" fill="rgba(128,82,255,0.06)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="1132" y="368" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">compound?</text>

      <!-- Node: synthesize + write_memory -->
      <rect x="848" y="340" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="848" y="340" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="932" y="361" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">synthesize →</text>
      <text x="932" y="375" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">write_memory</text>

      <!-- Node: Response (end pill) -->
      <rect x="648" y="340" width="168" height="48" rx="24" fill="#f7f6f4"/>
      <rect x="648" y="340" width="168" height="48" rx="24" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="732" y="361" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Response</text>
      <text x="732" y="375" fill="#6b6b6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WebSocket / ntfy</text>

      <!-- Legend -->
      <line x1="40" y1="460" x2="1240" y2="460" stroke="rgba(10,10,10,0.10)" stroke-width="0.8"/>
      <text x="40" y="476" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="488" width="14" height="10" rx="2" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="60" y="496" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Primary action path</text>
      <rect x="260" y="488" width="14" height="10" rx="2" fill="rgba(10,10,10,0.02)" stroke="rgba(10,10,10,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="280" y="496" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Graph pauses / loops back</text>
      <rect x="490" y="488" width="14" height="10" rx="2" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="510" y="496" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Entry / exit</text>
    </svg>