<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ze · What the LLM sees vs. what stays in the database</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f7f6f4; --color-ink:#0a0a0a; --color-muted:#6b6b6b; --color-accent:#8052ff;
      --font-sans:'Inter',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1000px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:760px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Trust boundary · Ze finance</p>
    <h1>What the LLM sees vs. what stays in the database</h1>
    <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="finance-llm-visibility-title finance-llm-visibility-desc">
      <title id="finance-llm-visibility-title">Data minimization boundary between the LLM and the finance database</title>
      <desc id="finance-llm-visibility-desc">Trust boundary diagram showing four pairs of finance data: aggregated summaries such as total notional, spending totals, cash balance, and requested position lists cross the boundary to the LLM, while the underlying raw data — individual position quantities and prices, transaction amounts and descriptions, transaction history, and CSV mapping parameters — stays in the database and is never sent.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6b6b"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f7f6f4"/>

      <!-- Column headers -->
      <text x="240" y="44" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle" letter-spacing="0.02em">LLM sees</text>
      <text x="240" y="60" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">AGGREGATED · SENT TO OPENROUTER</text>
      <text x="720" y="44" fill="#8052ff" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle" letter-spacing="0.02em">Stays in the DB</text>
      <text x="720" y="60" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">RAW · NEVER SENT</text>

      <!-- Trust boundary -->
      <line x1="480" y1="80" x2="480" y2="456" stroke="#8052ff" stroke-width="1.4" stroke-dasharray="4,4"/>
      <rect x="424" y="76" width="112" height="14" rx="2" fill="#f7f6f4"/>
      <text x="480" y="86" fill="#8052ff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">TRUST BOUNDARY</text>

      <!-- Row 1 -->
      <line x1="520" y1="116" x2="440" y2="116" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="40" y="80" width="400" height="72" rx="8" fill="#f7f6f4"/>
      <rect x="40" y="80" width="400" height="72" rx="8" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="240" y="112" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Total notional, total P&amp;L,</text>
      <text x="240" y="128" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">account count</text>
      <rect x="520" y="80" width="400" height="72" rx="8" fill="#f7f6f4"/>
      <rect x="520" y="80" width="400" height="72" rx="8" fill="rgba(10,10,10,0.05)" stroke="#6b6b6b" stroke-width="1"/>
      <text x="720" y="112" fill="#0a0a0a" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">Individual position</text>
      <text x="720" y="128" fill="#0a0a0a" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">quantities and prices</text>

      <!-- Row 2 -->
      <line x1="520" y1="212" x2="440" y2="212" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="40" y="176" width="400" height="72" rx="8" fill="#f7f6f4"/>
      <rect x="40" y="176" width="400" height="72" rx="8" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="240" y="208" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Spending totals</text>
      <text x="240" y="224" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">per category</text>
      <rect x="520" y="176" width="400" height="72" rx="8" fill="#f7f6f4"/>
      <rect x="520" y="176" width="400" height="72" rx="8" fill="rgba(10,10,10,0.05)" stroke="#6b6b6b" stroke-width="1"/>
      <text x="720" y="208" fill="#0a0a0a" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">Individual transaction amounts</text>
      <text x="720" y="224" fill="#0a0a0a" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">and descriptions</text>

      <!-- Row 3 -->
      <line x1="520" y1="308" x2="440" y2="308" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="40" y="272" width="400" height="72" rx="8" fill="#f7f6f4"/>
      <rect x="40" y="272" width="400" height="72" rx="8" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="240" y="312" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Account cash balance</text>
      <rect x="520" y="272" width="400" height="72" rx="8" fill="#f7f6f4"/>
      <rect x="520" y="272" width="400" height="72" rx="8" fill="rgba(10,10,10,0.05)" stroke="#6b6b6b" stroke-width="1"/>
      <text x="720" y="312" fill="#0a0a0a" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">Transaction history</text>

      <!-- Row 4 -->
      <line x1="520" y1="404" x2="440" y2="404" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="40" y="368" width="400" height="72" rx="8" fill="#f7f6f4"/>
      <rect x="40" y="368" width="400" height="72" rx="8" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="240" y="400" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">A list of positions</text>
      <text x="240" y="416" fill="#6b6b6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">only when explicitly requested</text>
      <rect x="520" y="368" width="400" height="72" rx="8" fill="#f7f6f4"/>
      <rect x="520" y="368" width="400" height="72" rx="8" fill="rgba(10,10,10,0.05)" stroke="#6b6b6b" stroke-width="1"/>
      <text x="720" y="400" fill="#0a0a0a" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">CSV mapping</text>
      <text x="720" y="416" fill="#0a0a0a" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">parameters</text>

      <!-- Legend -->
      <line x1="40" y1="476" x2="920" y2="476" stroke="rgba(10,10,10,0.10)" stroke-width="0.8"/>
      <text x="40" y="492" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="504" width="16" height="12" rx="2" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="64" y="513" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Aggregate reaches OpenRouter</text>
      <rect x="320" y="504" width="16" height="12" rx="2" fill="rgba(10,10,10,0.05)" stroke="#6b6b6b" stroke-width="1"/>
      <text x="344" y="513" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Raw data, Postgres-only</text>
      <line x1="600" y1="510" x2="628" y2="510" stroke="#6b6b6b" stroke-width="1.2"/>
      <text x="636" y="513" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Local aggregation crosses the boundary</text>
    </svg>
  </div>
</body>
</html>
