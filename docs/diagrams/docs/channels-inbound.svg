<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 616 292" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="channels-inbound-title channels-inbound-desc">
      <title id="channels-inbound-title">Channel inbound and outbound message flow</title>
      <desc id="channels-inbound-desc">Data flow diagram showing the ChannelRegistry feeding InboundPollingJob, which hands messages to InboundMessageProcessor for episode writing, signal emission, and contact-gated push notification; the processor writes ThreadChannelMap, which the outbound send_email tool reads to resolve which channel and thread to send through.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6b6b"/></marker>
        <marker id="arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8052ff"/></marker>
        <marker id="arr-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7f6f4"/>

      <!-- Lane tint: OUTBOUND row -->
      <rect x="0" y="132" width="616" height="96" fill="rgba(10,10,10,0.018)"/>

      <!-- Lane dividers -->
      <line x1="0" y1="36" x2="616" y2="36" stroke="rgba(10,10,10,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="132" x2="616" y2="132" stroke="rgba(10,10,10,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="228" x2="616" y2="228" stroke="rgba(10,10,10,0.12)" stroke-width="0.8"/>
      <line x1="140" y1="36" x2="140" y2="228" stroke="rgba(10,10,10,0.12)" stroke-width="0.8"/>

      <!-- Step header chips -->
      <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(10,10,10,0.12)"/>
      <text x="196" y="17" fill="#0a0a0a" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">01</text>
      <text x="196" y="29" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REGISTRY</text>

      <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(10,10,10,0.12)"/>
      <text x="308" y="17" fill="#0a0a0a" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">02</text>
      <text x="308" y="29" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POLL</text>

      <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(128,82,255,0.20)"/>
      <text x="420" y="17" fill="#8052ff" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">03</text>
      <text x="420" y="29" fill="#8052ff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROCESS</text>

      <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(10,10,10,0.12)"/>
      <text x="532" y="17" fill="#0a0a0a" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">04</text>
      <text x="532" y="29" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE</text>

      <!-- Lane labels -->
      <text x="70" y="80" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MESSAGE</text>
      <text x="70" y="92" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">INBOUND</text>
      <text x="70" y="176" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MESSAGE</text>
      <text x="70" y="188" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OUTBOUND</text>

      <!-- ============ ARROWS (drawn before node boxes) ============ -->
      <!-- A: ChannelRegistry -> B: InboundPollingJob -->
      <line x1="246" y1="80" x2="258" y2="80" stroke="#6b6b6b" stroke-width="1" marker-end="url(#arr-muted)"/>
      <!-- B: InboundPollingJob -> C: InboundMessageProcessor -->
      <line x1="358" y1="80" x2="370" y2="80" stroke="#6b6b6b" stroke-width="1" marker-end="url(#arr-muted)"/>
      <!-- C: InboundMessageProcessor -> D: ThreadChannelMap (focal cross-lane handoff) -->
      <line x1="420" y1="116" x2="420" y2="140" stroke="#8052ff" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <!-- D: ThreadChannelMap -> E: send_email tool -->
      <line x1="470" y1="176" x2="482" y2="176" stroke="#6b6b6b" stroke-width="1" marker-end="url(#arr-muted)"/>

      <!-- Focal arrow label (vertical segment: label sits beside, 8px gap from the line) -->
      <rect x="428" y="122" width="64" height="12" rx="2" fill="#f7f6f4"/>
      <text x="460" y="131" fill="#8052ff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">THREAD MAP</text>

      <!-- ============ NODES ============ -->

      <!-- Node A: ChannelRegistry (store, INBOUND · step 01) -->
      <rect x="146" y="44" width="100" height="72" rx="6" fill="#f7f6f4"/>
      <rect x="146" y="44" width="100" height="72" rx="6" fill="rgba(10,10,10,0.05)" stroke="#6b6b6b" stroke-width="1"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="transparent" stroke="rgba(107,107,107,0.40)" stroke-width="0.8"/>
      <text x="159" y="56" fill="#6b6b6b" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IN</text>
      <text x="196" y="67" fill="#0a0a0a" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">ChannelRegistry</text>
      <text x="196" y="82" fill="#6b6b6b" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">Gmail ×2 · future</text>
      <text x="196" y="94" fill="#8a8a8a" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">InboundChannel</text>

      <!-- Node B: InboundPollingJob (backend, INBOUND · step 02) -->
      <rect x="258" y="44" width="100" height="72" rx="6" fill="#f7f6f4"/>
      <rect x="258" y="44" width="100" height="72" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="262" y="48" width="18" height="10" rx="3" fill="transparent" stroke="rgba(107,107,107,0.40)" stroke-width="0.8"/>
      <text x="271" y="56" fill="#6b6b6b" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IN</text>
      <text x="308" y="64" fill="#0a0a0a" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Inbound</text>
      <text x="308" y="76" fill="#0a0a0a" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">PollingJob</text>
      <text x="308" y="92" fill="#6b6b6b" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">cron · 5 min</text>
      <text x="308" y="104" fill="#8a8a8a" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">reads watermark</text>

      <!-- Node C: InboundMessageProcessor (focal, INBOUND · step 03) -->
      <rect x="370" y="44" width="100" height="72" rx="6" fill="#f7f6f4"/>
      <rect x="370" y="44" width="100" height="72" rx="6" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <rect x="374" y="48" width="18" height="10" rx="3" fill="transparent" stroke="rgba(128,82,255,0.50)" stroke-width="0.8"/>
      <text x="383" y="56" fill="#8052ff" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IN</text>
      <text x="420" y="64" fill="#0a0a0a" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Message</text>
      <text x="420" y="76" fill="#0a0a0a" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Processor</text>
      <text x="420" y="92" fill="#6b6b6b" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">episode · signal · push</text>
      <text x="420" y="104" fill="#8a8a8a" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">known contacts only</text>

      <!-- Node D: ThreadChannelMap (store, OUTBOUND · step 03) -->
      <rect x="370" y="140" width="100" height="72" rx="6" fill="#f7f6f4"/>
      <rect x="370" y="140" width="100" height="72" rx="6" fill="rgba(10,10,10,0.05)" stroke="#6b6b6b" stroke-width="1"/>
      <rect x="374" y="144" width="24" height="10" rx="3" fill="transparent" stroke="rgba(107,107,107,0.40)" stroke-width="0.8"/>
      <text x="386" y="152" fill="#6b6b6b" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OUT</text>
      <text x="420" y="163" fill="#0a0a0a" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">ThreadChannelMap</text>
      <text x="420" y="178" fill="#6b6b6b" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">thread → channel_id</text>
      <text x="420" y="190" fill="#8a8a8a" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">UserChannelStore</text>

      <!-- Node E: send_email tool (backend, OUTBOUND · step 04) -->
      <rect x="482" y="140" width="100" height="72" rx="6" fill="#f7f6f4"/>
      <rect x="482" y="140" width="100" height="72" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="486" y="144" width="24" height="10" rx="3" fill="transparent" stroke="rgba(107,107,107,0.40)" stroke-width="0.8"/>
      <text x="498" y="152" fill="#6b6b6b" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OUT</text>
      <text x="532" y="163" fill="#0a0a0a" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">send_email tool</text>
      <text x="532" y="178" fill="#6b6b6b" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">resolves channel</text>
      <text x="532" y="190" fill="#8a8a8a" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">thread → default</text>

      <!-- ============ LEGEND ============ -->
      <text x="0" y="244" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="0" y="256" width="14" height="10" rx="2" fill="rgba(10,10,10,0.05)" stroke="#6b6b6b" stroke-width="1"/>
      <text x="20" y="264" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Registry / store</text>

      <rect x="148" y="256" width="14" height="10" rx="2" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="168" y="264" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Job / tool</text>

      <rect x="284" y="256" width="14" height="10" rx="2" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="304" y="264" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Fan-out processor</text>

      <line x1="452" y1="261" x2="474" y2="261" stroke="#8052ff" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <text x="480" y="264" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Cross-role write</text>
    </svg>