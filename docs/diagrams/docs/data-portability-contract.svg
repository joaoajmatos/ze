<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-portability-contract-title data-portability-contract-desc">
      <title id="data-portability-contract-title">Data portability contract: plugins, domains, and operations</title>
      <desc id="data-portability-contract-desc">Architecture diagram showing ZePlugin implementations contributing DataDomain instances into a domain registry, which DataPortabilityService drives to export a ZIP archive, import and restore from a schema-checked ZIP archive transactionally, or delete all domain rows.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6b6b"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f7f6f4"/>

      <!-- Arrows (drawn before nodes) -->

      <!-- A1: ZePlugin(s) -> DataDomain registry (straight, same y) -->
      <line x1="184" y1="220" x2="224" y2="220" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A2: DataDomain registry -> DataPortabilityService (straight, same y) -->
      <line x1="368" y1="220" x2="408" y2="220" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A3: Hub -> Export (elbow, right+up) -->
      <path d="M568,192 H584 Q592,192 592,184 V88 Q592,80 600,80 H616" fill="none" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A4: Hub -> Import (straight, same y) -->
      <line x1="568" y1="220" x2="616" y2="220" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A5: Hub -> Delete (elbow, right+down) -->
      <path d="M568,248 H584 Q592,248 592,256 V352 Q592,360 600,360 H616" fill="none" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A6: Export -> ZIP archive (elbow, enter top edge) -->
      <path d="M756,80 H866 Q874,80 874,88 V120" fill="none" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A7: ZIP archive -> Import (dashed elbow, restore path, enter right edge) -->
      <path d="M804,152 H788 Q780,152 780,160 V212 Q780,220 772,220 H756" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Node: ZePlugin(s) (input) -->
      <rect x="40" y="188" width="144" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="40" y="188" width="144" height="64" rx="6" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="112" y="216" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">ZePlugin(s)</text>
      <text x="112" y="232" fill="#6b6b6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data_domains()</text>

      <!-- Node: DataDomain registry (store) -->
      <rect x="224" y="188" width="144" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="224" y="188" width="144" height="64" rx="6" fill="rgba(10,10,10,0.05)" stroke="#6b6b6b" stroke-width="1"/>
      <text x="296" y="216" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">DataDomain</text>
      <text x="296" y="230" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">registry</text>

      <!-- Node: DataPortabilityService (focal hub) -->
      <rect x="408" y="164" width="160" height="112" rx="6" fill="#f7f6f4"/>
      <rect x="408" y="164" width="160" height="112" rx="6" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="488" y="204" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">DataPortability</text>
      <text x="488" y="220" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Service</text>
      <text x="488" y="240" fill="#6b6b6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ze-data</text>

      <!-- Node: Export -->
      <rect x="616" y="48" width="140" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="616" y="48" width="140" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="686" y="76" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Export</text>
      <text x="686" y="92" fill="#6b6b6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ ZIP archive</text>

      <!-- Node: Import -->
      <rect x="616" y="188" width="140" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="616" y="188" width="140" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="686" y="216" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Import</text>
      <text x="686" y="232" fill="#6b6b6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">← ZIP, transactional</text>

      <!-- Node: Delete -->
      <rect x="616" y="328" width="140" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="616" y="328" width="140" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="686" y="356" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Delete</text>
      <text x="686" y="372" fill="#6b6b6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">wipes all rows</text>

      <!-- Node: ZIP archive (store) -->
      <rect x="804" y="120" width="140" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="804" y="120" width="140" height="64" rx="6" fill="rgba(10,10,10,0.05)" stroke="#6b6b6b" stroke-width="1"/>
      <text x="874" y="148" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">ZIP archive</text>
      <text x="874" y="164" fill="#6b6b6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">manifest.json + N JSON</text>

      <!-- Legend -->
      <line x1="40" y1="412" x2="944" y2="412" stroke="rgba(10,10,10,0.10)" stroke-width="0.8"/>
      <text x="40" y="428" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="436" width="16" height="8" rx="2" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="64" y="443" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Portability hub</text>
      <rect x="280" y="436" width="16" height="8" rx="2" fill="rgba(10,10,10,0.05)" stroke="#6b6b6b" stroke-width="1"/>
      <text x="304" y="443" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Domain registry / archive</text>
      <line x1="600" y1="440" x2="624" y2="440" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="632" y="443" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Restore (schema-checked)</text>
    </svg>