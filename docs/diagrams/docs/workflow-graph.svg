<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wf-graph-title wf-graph-desc">
      <title id="wf-graph-title">Workflow step execution graph</title>
      <desc id="wf-graph-desc">Flowchart of a workflow step: it loads, routes, and fetches context, then preflight runs the step; a write that the step does not pre-approve parks at await_write_confirmation, which holds the run for an unattended workflow, then the step writes memory and verifies, looping back for more steps or ending in a synthesis or a failure.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6b6b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8052ff"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f7f6f4"/>

      <!-- Row1 -->
      <line x1="216" y1="144" x2="248" y2="144" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="416" y1="144" x2="448" y2="144" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="616" y1="144" x2="648" y2="144" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="816" y1="144" x2="848" y2="144" stroke="#8052ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- execute_tool -> await_write_confirmation (park: a write the step does not pre-approve) -->
      <line x1="932" y1="168" x2="932" y2="248" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- await_write_confirmation -> execute_tool (resume after the answer) -->
      <path d="M1016,272 H1032 Q1040,272 1040,264 V152 Q1040,144 1032,144 H1016" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- execute_tool -> write_memory (approved calls run; resumed loops continue) -->
      <path d="M1016,132 H1060 V364 H1016" fill="none" stroke="#8052ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Row2 -->
      <line x1="848" y1="364" x2="816" y2="364" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="648" y1="364" x2="616" y2="364" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M732,396 V428 Q732,436 724,436 H340 Q332,436 332,428 V388" fill="none" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M732,332 V310 H28 V144 H48" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <path d="M332,388 V420 Q332,428 324,428 H220 Q212,428 212,436 V460" fill="none" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M532,388 V412 Q532,420 524,420 H300 Q292,420 292,428 V460" fill="none" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="880" y="122" width="66" height="12" rx="2" fill="#f7f6f4"/>
      <text x="913" y="131" fill="#8052ff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">RUN</text>
      <rect x="940" y="200" width="46" height="12" rx="2" fill="#f7f6f4"/>
      <text x="963" y="209" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PARK</text>
      <rect x="1064" y="232" width="52" height="12" rx="2" fill="#f7f6f4"/>
      <text x="1090" y="241" fill="#8052ff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">APPROVED</text>
      <rect x="230" y="304" width="140" height="12" rx="2" fill="#f7f6f4"/>
      <text x="300" y="313" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">PASSED · MORE STEPS</text>
      <rect x="352" y="442" width="150" height="12" rx="2" fill="#f7f6f4"/>
      <text x="427" y="451" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">PASSED · LAST STEP</text>
      <rect x="550" y="352" width="52" height="12" rx="2" fill="#f7f6f4"/>
      <text x="576" y="361" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">FAILED</text>

      <!-- Node: load_workflow_step -->
      <rect x="48" y="120" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="48" y="120" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="132" y="141" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">load_workflow_</text>
      <text x="132" y="155" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">step</text>

      <!-- Node: embed_route -->
      <rect x="248" y="120" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="248" y="120" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="332" y="149" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">embed_route</text>

      <!-- Node: fetch_context -->
      <rect x="448" y="120" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="448" y="120" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="532" y="149" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">fetch_context</text>

      <!-- Node: preflight (diamond) -->
      <polygon points="732,112 816,144 732,176 648,144" fill="#f7f6f4"/>
      <polygon points="732,112 816,144 732,176 648,144" fill="rgba(128,82,255,0.06)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="732" y="148" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">preflight</text>

      <!-- Node: execute_tool -->
      <rect x="848" y="120" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="848" y="120" width="168" height="48" rx="6" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="932" y="149" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">execute_tool</text>

      <!-- Node: await_write_confirmation (park, held when unattended) -->
      <rect x="848" y="248" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="848" y="248" width="168" height="48" rx="6" fill="rgba(10,10,10,0.02)" stroke="rgba(10,10,10,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="932" y="269" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">await_write_</text>
      <text x="932" y="281" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">confirmation</text>

      <!-- Node: END (pill) -->
      <rect x="132" y="460" width="200" height="48" rx="24" fill="#f7f6f4"/>
      <rect x="132" y="460" width="200" height="48" rx="24" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="232" y="489" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">END</text>

      <!-- Node: workflow_synthesize -->
      <rect x="248" y="340" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="248" y="340" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="332" y="361" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">workflow_</text>
      <text x="332" y="373" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">synthesize</text>

      <!-- Node: workflow_failed -->
      <rect x="448" y="340" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="448" y="340" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="532" y="361" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">workflow_</text>
      <text x="532" y="373" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">failed</text>

      <!-- Node: verify_step (diamond) -->
      <polygon points="732,332 816,364 732,396 648,364" fill="#f7f6f4"/>
      <polygon points="732,332 816,364 732,396 648,364" fill="rgba(10,10,10,0.02)" stroke="#0a0a0a" stroke-width="1"/>
      <text x="732" y="361" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">verify_step</text>

      <!-- Node: write_memory -->
      <rect x="848" y="340" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="848" y="340" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="932" y="369" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">write_memory</text>

      <!-- Note: per-step approved_writes and unattended holds -->
      <rect x="420" y="236" width="206" height="62" rx="4" fill="none" stroke="rgba(10,10,10,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="428" y="251" fill="#6b6b6b" font-size="7.5" font-family="'Geist Mono', monospace" letter-spacing="0.06em">UNATTENDED STEP</text>
      <text x="428" y="266" fill="#0a0a0a" font-size="8.5" font-family="'Inter', sans-serif">approved_writes run with no pause;</text>
      <text x="428" y="279" fill="#0a0a0a" font-size="8.5" font-family="'Inter', sans-serif">other writes are held for 24 h</text>
      <text x="428" y="292" fill="#0a0a0a" font-size="8.5" font-family="'Inter', sans-serif">and pushed until you answer</text>

      <!-- Legend -->
      <line x1="40" y1="548" x2="1080" y2="548" stroke="rgba(10,10,10,0.10)" stroke-width="0.8"/>
      <text x="40" y="564" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="576" width="14" height="10" rx="2" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="60" y="584" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Primary run path (RUN)</text>
      <rect x="280" y="576" width="14" height="10" rx="2" fill="rgba(10,10,10,0.02)" stroke="rgba(10,10,10,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="300" y="584" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Pauses for approval (park, resume)</text>
      <rect x="520" y="576" width="14" height="10" rx="2" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="540" y="584" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Terminal</text>
    </svg>
