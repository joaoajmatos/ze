      <title id="cadence-title">Ze's job schedule grouped into daily, weekly, continuous, and event-driven cadence tiers</title>
      <desc id="cadence-desc">Board diagram grouping every scheduled job into four cadence tiers — fixed daily UTC times from 2 AM consolidation through 8:30 AM contact review, fixed weekly times from Sunday morning insights through Tuesday stuck-goal detection, continuous fixed-interval jobs from every 10 minutes to every 6 hours, and event-driven jobs that fire immediately on failure or trigger — with the weekly accountability narrative and cost anomaly detection called out as the two most consequential jobs.</desc>
