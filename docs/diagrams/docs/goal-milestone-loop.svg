<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="goal-loop-title goal-loop-desc">
      <title id="goal-loop-title">Goal milestone advance loop</title>
      <desc id="goal-loop-desc">Flowchart showing a goal advancing: if not active it returns, if a gate is due it fires the gate and awaits confirmation, otherwise it runs the milestone via the agent registry, stores output and learning, and checks for more milestones — looping back to advance or marking the goal complete.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6b6b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8052ff"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f7f6f4"/>

      <line x1="280" y1="124" x2="280" y2="160" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="196" x2="560" y2="196" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="232" x2="280" y2="280" stroke="#8052ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="380" y1="316" x2="560" y2="316" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="352" x2="280" y2="388" stroke="#8052ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="280" y1="436" x2="280" y2="484" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="532" x2="280" y2="568" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="604" x2="560" y2="604" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M180,604 H108 Q100,604 100,596 V108 Q100,100 108,100 H180" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="440" y="184" width="34" height="12" rx="2" fill="#f7f6f4"/>
      <text x="457" y="193" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>
      <rect x="252" y="248" width="36" height="12" rx="2" fill="#f7f6f4"/>
      <text x="270" y="257" fill="#8052ff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>
      <rect x="440" y="304" width="34" height="12" rx="2" fill="#f7f6f4"/>
      <text x="457" y="313" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>
      <rect x="252" y="364" width="36" height="12" rx="2" fill="#f7f6f4"/>
      <text x="270" y="373" fill="#8052ff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>
      <rect x="440" y="592" width="34" height="12" rx="2" fill="#f7f6f4"/>
      <text x="457" y="601" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>
      <rect x="60" y="346" width="36" height="12" rx="2" fill="#f7f6f4"/>
      <text x="78" y="355" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>

      <!-- advance (start pill) -->
      <rect x="180" y="76" width="200" height="48" rx="24" fill="#f7f6f4"/>
      <rect x="180" y="76" width="200" height="48" rx="24" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="280" y="105" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">advance</text>

      <!-- status ACTIVE? -->
      <polygon points="280,160 380,196 280,232 180,196" fill="#f7f6f4"/>
      <polygon points="280,160 380,196 280,232 180,196" fill="rgba(10,10,10,0.02)" stroke="#0a0a0a" stroke-width="1"/>
      <text x="280" y="192" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">status</text>
      <text x="280" y="204" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">ACTIVE?</text>

      <!-- return (end pill) -->
      <rect x="560" y="172" width="220" height="48" rx="24" fill="#f7f6f4"/>
      <rect x="560" y="172" width="220" height="48" rx="24" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="670" y="201" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">return</text>

      <!-- gate due? -->
      <polygon points="280,280 380,316 280,352 180,316" fill="#f7f6f4"/>
      <polygon points="280,280 380,316 280,352 180,316" fill="rgba(10,10,10,0.02)" stroke="#0a0a0a" stroke-width="1"/>
      <text x="280" y="312" fill="#0a0a0a" font-size="9.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">gate due before</text>
      <text x="280" y="324" fill="#0a0a0a" font-size="9.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">next milestone?</text>

      <!-- fire gate (end) -->
      <rect x="560" y="292" width="220" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="560" y="292" width="220" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="670" y="313" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">fire gate →</text>
      <text x="670" y="327" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">AWAITING_GATE</text>

      <!-- run milestone -->
      <rect x="180" y="388" width="200" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="180" y="388" width="200" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="280" y="409" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">run milestone via</text>
      <text x="280" y="423" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">agent registry</text>

      <!-- store output -->
      <rect x="180" y="484" width="200" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="180" y="484" width="200" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="280" y="505" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">store output +</text>
      <text x="280" y="519" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">learning · notify progress</text>

      <!-- more milestones? -->
      <polygon points="280,568 380,604 280,640 180,604" fill="#f7f6f4"/>
      <polygon points="280,568 380,604 280,640 180,604" fill="rgba(128,82,255,0.06)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="280" y="600" fill="#0a0a0a" font-size="9.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">more</text>
      <text x="280" y="612" fill="#0a0a0a" font-size="9.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">milestones?</text>

      <!-- mark COMPLETED (end) -->
      <rect x="560" y="580" width="220" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="560" y="580" width="220" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="670" y="601" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">mark COMPLETED</text>
      <text x="670" y="615" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">notify</text>

      <!-- Legend -->
      <line x1="40" y1="680" x2="860" y2="680" stroke="rgba(10,10,10,0.10)" stroke-width="0.8"/>
      <text x="40" y="696" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="708" width="14" height="10" rx="2" fill="rgba(128,82,255,0.06)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="60" y="716" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Loop-back decision</text>
      <rect x="230" y="708" width="14" height="10" rx="2" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="250" y="716" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Entry / exit</text>
    </svg>