<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="boot-title boot-desc">
      <title id="boot-title">ze-api startup / boot chain</title>
      <desc id="boot-desc">Sequence diagram of the twelve cross-cutting modules loaded in order at ze-api startup, from settings and logging through embeddings, the database pool, plugin and agent bootstrap, proactive job registration, the ZeContainer wiring step, persona storage, the Gmail channel, and finally the native WebSocket interface.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6b6b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8052ff"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f7f6f4"/>

      <!-- Row1 arrows -->
      <line x1="148" y1="150" x2="164" y2="150" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="308" y1="150" x2="324" y2="150" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="468" y1="150" x2="484" y2="150" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="628" y1="150" x2="644" y2="150" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="788" y1="150" x2="804" y2="150" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- wrap: row1 col6 -> row2 col1 -->
      <path d="M1120,182 V206 Q1120,214 1112,214 H92 Q84,214 84,222 V246" fill="none" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Row2 arrows -->
      <line x1="148" y1="270" x2="164" y2="270" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="308" y1="270" x2="324" y2="270" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="468" y1="270" x2="484" y2="270" stroke="#8052ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="628" y1="270" x2="644" y2="270" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="788" y1="270" x2="804" y2="270" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Row 1 nodes (steps 1-6) ===== -->
      <!-- 01 settings.py -->
      <rect x="40" y="118" width="108" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="40" y="118" width="108" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="48" y="126" width="20" height="12" rx="2" fill="transparent" stroke="rgba(10,10,10,0.40)" stroke-width="0.8"/>
      <text x="58" y="135" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">01</text>
      <text x="94" y="150" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">settings.py</text>
      <text x="94" y="172" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">ZeApiSettings</text>

      <!-- 02 ze_logging -->
      <rect x="164" y="118" width="144" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="164" y="118" width="144" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="172" y="126" width="20" height="12" rx="2" fill="transparent" stroke="rgba(10,10,10,0.40)" stroke-width="0.8"/>
      <text x="182" y="135" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">02</text>
      <text x="236" y="150" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">ze_logging</text>
      <text x="236" y="172" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">structlog · get_logger</text>

      <!-- 03 errors.py -->
      <rect x="324" y="118" width="144" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="324" y="118" width="144" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="332" y="126" width="20" height="12" rx="2" fill="transparent" stroke="rgba(10,10,10,0.40)" stroke-width="0.8"/>
      <text x="342" y="135" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">03</text>
      <text x="396" y="150" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">errors.py</text>
      <text x="396" y="172" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">ZeError hierarchy</text>

      <!-- 04 embeddings.py -->
      <rect x="484" y="118" width="144" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="484" y="118" width="144" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="492" y="126" width="20" height="12" rx="2" fill="transparent" stroke="rgba(10,10,10,0.40)" stroke-width="0.8"/>
      <text x="502" y="135" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">04</text>
      <text x="556" y="150" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">embeddings.py</text>
      <text x="556" y="172" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">MiniLM-L12-v2 singleton</text>

      <!-- 05 db.py -->
      <rect x="644" y="118" width="144" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="644" y="118" width="144" height="64" rx="6" fill="rgba(10,10,10,0.05)" stroke="#6b6b6b" stroke-width="1"/>
      <rect x="652" y="126" width="20" height="12" rx="2" fill="transparent" stroke="rgba(10,10,10,0.40)" stroke-width="0.8"/>
      <text x="662" y="135" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">05</text>
      <text x="716" y="150" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">db.py</text>
      <text x="716" y="172" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">asyncpg pool, lifespan-managed</text>

      <!-- 06 plugin/bootstrap.py -->
      <rect x="804" y="118" width="144" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="804" y="118" width="144" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="812" y="126" width="20" height="12" rx="2" fill="transparent" stroke="rgba(10,10,10,0.40)" stroke-width="0.8"/>
      <text x="822" y="135" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">06</text>
      <text x="876" y="150" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">plugin/bootstrap.py</text>
      <text x="876" y="172" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">plugin discovery + DI</text>

      <!-- 07 agents/bootstrap.py -->
      <rect x="964" y="118" width="156" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="964" y="118" width="156" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="972" y="126" width="20" height="12" rx="2" fill="transparent" stroke="rgba(10,10,10,0.40)" stroke-width="0.8"/>
      <text x="982" y="135" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">07</text>
      <text x="1042" y="150" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">agents/bootstrap.py</text>
      <text x="1042" y="172" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">bootstrap_agents()</text>

      <!-- ===== Row 2 nodes (steps 8-12), continuing left to right ===== -->
      <!-- 08 compose.py -->
      <rect x="40" y="238" width="108" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="40" y="238" width="108" height="64" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="48" y="246" width="20" height="12" rx="2" fill="transparent" stroke="rgba(10,10,10,0.40)" stroke-width="0.8"/>
      <text x="58" y="255" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">08</text>
      <text x="94" y="270" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">compose.py</text>
      <text x="94" y="292" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">register proactive jobs</text>

      <!-- 09 container.py (focal) -->
      <rect x="164" y="238" width="144" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="164" y="238" width="144" height="64" rx="6" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <rect x="172" y="246" width="20" height="12" rx="2" fill="transparent" stroke="rgba(128,82,255,0.50)" stroke-width="0.8"/>
      <text x="182" y="255" fill="#8052ff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">09</text>
      <text x="236" y="270" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">container.py</text>
      <text x="236" y="292" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">ZeContainer wires plugins</text>

      <!-- 10 persona/ -->
      <rect x="324" y="238" width="144" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="324" y="238" width="144" height="64" rx="6" fill="rgba(10,10,10,0.05)" stroke="#6b6b6b" stroke-width="1"/>
      <rect x="332" y="246" width="20" height="12" rx="2" fill="transparent" stroke="rgba(10,10,10,0.40)" stroke-width="0.8"/>
      <text x="342" y="255" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">10</text>
      <text x="396" y="270" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">persona/</text>
      <text x="396" y="292" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">PostgresPersonaStore</text>

      <!-- 11 gmail_channel.py -->
      <rect x="484" y="238" width="144" height="64" rx="6" fill="#f7f6f4"/>
      <rect x="484" y="238" width="144" height="64" rx="6" fill="rgba(10,10,10,0.03)" stroke="rgba(10,10,10,0.30)" stroke-width="1"/>
      <rect x="492" y="246" width="20" height="12" rx="2" fill="transparent" stroke="rgba(10,10,10,0.40)" stroke-width="0.8"/>
      <text x="502" y="255" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">11</text>
      <text x="556" y="270" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">gmail_channel.py</text>
      <text x="556" y="292" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">GmailChannel (ze-google)</text>

      <!-- 12 interface/native.py -->
      <rect x="644" y="238" width="144" height="64" rx="24" fill="#f7f6f4"/>
      <rect x="644" y="238" width="144" height="64" rx="24" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="716" y="264" fill="#0a0a0a" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">interface/native.py</text>
      <text x="716" y="286" fill="#6b6b6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">NativeAppInterface, ready</text>

      <!-- Legend -->
      <line x1="40" y1="342" x2="1240" y2="342" stroke="rgba(10,10,10,0.10)" stroke-width="0.8"/>
      <text x="40" y="358" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="370" width="14" height="10" rx="2" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="60" y="378" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Wires all ZePlugins</text>
      <rect x="240" y="370" width="14" height="10" rx="2" fill="rgba(10,10,10,0.05)" stroke="#6b6b6b" stroke-width="1"/>
      <text x="260" y="378" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Store / state</text>
      <rect x="410" y="370" width="14" height="10" rx="2" fill="rgba(10,10,10,0.03)" stroke="rgba(10,10,10,0.30)" stroke-width="1"/>
      <text x="430" y="378" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">External integration</text>
      <rect x="600" y="370" width="14" height="10" rx="2" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="620" y="378" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Startup complete</text>
      <text x="800" y="378" fill="#6b6b6b" font-size="8.5" font-family="'Instrument Serif', serif" font-style="italic">Twelve modules, one order — each depends on what loaded before it.</text>
    </svg>
