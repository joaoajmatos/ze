<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="graph-flow-title graph-flow-desc">
      <title id="graph-flow-title">How a message flows through the LangGraph orchestration graph</title>
      <desc id="graph-flow-desc">Flowchart showing a message entering from ze-web over WebSocket, moving through preprocess, embed_route, fetch_context, and a capability_check decision that either executes a tool or pauses for confirmation, then continuing through correlate, surface_loops, synthesize, and a combined record_trace/write_memory step before the response returns to ze-web.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6b6b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8052ff"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7f6f4"/>

      <!-- Row 1 connectors (left to right) -->
      <line x1="216" y1="144" x2="248" y2="144" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="416" y1="144" x2="448" y2="144" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="616" y1="144" x2="648" y2="144" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="816" y1="144" x2="848" y2="144" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1016" y1="144" x2="1048" y2="144" stroke="#8052ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Vertical drop: execute_tool -> correlate -->
      <line x1="1132" y1="168" x2="1132" y2="320" stroke="#8052ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Vertical drop: capability_check -> await_confirmation (dashed, terminal) -->
      <line x1="932" y1="176" x2="932" y2="248" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Row 2 connectors (right to left) -->
      <line x1="1048" y1="344" x2="1016" y2="344" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="848" y1="344" x2="816" y2="344" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="648" y1="344" x2="616" y2="344" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="448" y1="344" x2="416" y2="344" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Edge labels -->
      <rect x="200" y="122" width="66" height="12" rx="2" fill="#f7f6f4"/>
      <text x="233" y="131" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">WS /ws</text>

      <rect x="984" y="122" width="66" height="12" rx="2" fill="#f7f6f4"/>
      <text x="1017" y="131" fill="#8052ff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXECUTE</text>

      <rect x="900" y="204" width="66" height="12" rx="2" fill="#f7f6f4"/>
      <text x="932" y="213" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONFIRM</text>

      <!-- Node: ze-web (start, pill) -->
      <rect x="48" y="120" width="168" height="48" rx="24" fill="#f7f6f4"/>
      <rect x="48" y="120" width="168" height="48" rx="24" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="132" y="149" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">ze-web</text>

      <!-- Node: preprocess -->
      <rect x="248" y="120" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="248" y="120" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="332" y="149" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">preprocess</text>

      <!-- Node: embed_route -->
      <rect x="448" y="120" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="448" y="120" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="532" y="149" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">embed_route</text>

      <!-- Node: fetch_context -->
      <rect x="648" y="120" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="648" y="120" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="732" y="149" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">fetch_context</text>

      <!-- Node: capability_check (decision diamond) -->
      <polygon points="932,112 1016,144 932,176 848,144" fill="#f7f6f4"/>
      <polygon points="932,112 1016,144 932,176 848,144" fill="rgba(128,82,255,0.06)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="932" y="141" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">capability_</text>
      <text x="932" y="153" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">check</text>

      <!-- Node: execute_tool -->
      <rect x="1048" y="120" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="1048" y="120" width="168" height="48" rx="6" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="1132" y="149" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">execute_tool</text>

      <!-- Node: await_confirmation (terminal, dashed) -->
      <rect x="848" y="248" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="848" y="248" width="168" height="48" rx="6" fill="rgba(10,10,10,0.02)" stroke="rgba(10,10,10,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="932" y="273" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">await_</text>
      <text x="932" y="285" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">confirmation</text>

      <!-- Node: correlate -->
      <rect x="1048" y="320" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="1048" y="320" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="1132" y="349" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">correlate</text>

      <!-- Node: surface_loops -->
      <rect x="848" y="320" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="848" y="320" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="932" y="349" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">surface_loops</text>

      <!-- Node: synthesize -->
      <rect x="648" y="320" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="648" y="320" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="732" y="349" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">synthesize</text>

      <!-- Node: record_trace + write_memory -->
      <rect x="448" y="320" width="168" height="48" rx="6" fill="#f7f6f4"/>
      <rect x="448" y="320" width="168" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <text x="532" y="343" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">record_trace →</text>
      <text x="532" y="356" fill="#0a0a0a" font-size="10.5" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">write_memory</text>

      <!-- Node: response (end, pill) -->
      <rect x="248" y="320" width="168" height="48" rx="24" fill="#f7f6f4"/>
      <rect x="248" y="320" width="168" height="48" rx="24" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="332" y="343" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">response +</text>
      <text x="332" y="356" fill="#0a0a0a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">components</text>

      <!-- Legend -->
      <line x1="40" y1="460" x2="1240" y2="460" stroke="rgba(10,10,10,0.10)" stroke-width="0.8"/>
      <text x="40" y="476" fill="#6b6b6b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="488" width="14" height="10" rx="2" fill="rgba(128,82,255,0.08)" stroke="#8052ff" stroke-width="1.2"/>
      <text x="60" y="496" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Primary (EXECUTE) path</text>

      <rect x="260" y="488" width="14" height="10" rx="2" fill="rgba(10,10,10,0.02)" stroke="rgba(10,10,10,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="280" y="496" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Graph pauses (CONFIRM)</text>

      <rect x="470" y="488" width="14" height="10" rx="2" fill="rgba(107,107,107,0.10)" stroke="#8a8a8a" stroke-width="1"/>
      <text x="490" y="496" fill="#6b6b6b" font-size="8.5" font-family="'Inter', sans-serif">Entry / exit</text>
    </svg>
