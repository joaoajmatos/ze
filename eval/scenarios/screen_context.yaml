# Phase 195: the screen context. `setup:` rows are created through the verifier's database
# connection before the scenario and removed after it (Fixtures in ze_eval/fixtures.py), so run
# this on `make dev-eval` against a throwaway database. Deixis cases send an ask_bar context with
# the record selected or open; chat_about cases send the chip's explicit subject. The Governance
# case is tagged skip until phase 190 ships the page.

- id: screen_world_loop_en
  description: 'World: a loop is selected and the user says this'
  setup:
  - kind: loop
    name: lp
    fields:
      title: Reply to Ana about the contract
  turns:
  - prompt: When is this due?
    context:
      place: world
      route: /world
      origin: ask_bar
      selection:
      - kind: loop
        id: '{{lp.id}}'
        label: Reply to Ana about the contract
        component: loop_row
  expected_agent: companion
  tags:
  - screen_context
  - deixis
  - world
  criteria:
  - about the referenced record, not a generic answer
  - does not ask which one the user means
  - does not describe the screen back to the user
  - states nothing about the record that is not in the screen note
  - The reply is about the selected loop, not a general answer about deadlines
- id: screen_doing_goal_en
  description: 'Doing: the goal page is open'
  setup:
  - kind: goal
    name: gl
    fields:
      title: Run a half marathon
  turns:
  - prompt: How is this going?
    context:
      place: doing
      route: /doing/goals/{{gl.id}}
      origin: ask_bar
      subject:
      - kind: goal
        id: '{{gl.id}}'
        label: Run a half marathon
        component: goal_module
  tags:
  - screen_context
  - deixis
  - doing
  criteria:
  - about the referenced record, not a generic answer
  - does not ask which one the user means
  - does not describe the screen back to the user
  - states nothing about the record that is not in the screen note
  - The reply is about this goal
- id: screen_doing_execution_en
  description: 'Doing: a failed workflow execution is open'
  setup:
  - kind: workflow
    name: wf
    fields:
      name: Weekly report
  - kind: workflow_execution
    name: run
    parent: wf
    fields:
      status: failed
  turns:
  - prompt: Why did this run fail?
    context:
      place: doing
      route: /doing/workflows/{{wf.id}}
      origin: ask_bar
      subject:
      - kind: workflow
        id: '{{wf.id}}'
        label: Weekly report
        component: workflow_module
      - kind: workflow_execution
        id: '{{run.id}}'
        parent_id: '{{wf.id}}'
        component: execution_row
  tags:
  - screen_context
  - deixis
  - doing
  criteria:
  - about the referenced record, not a generic answer
  - does not ask which one the user means
  - does not describe the screen back to the user
  - states nothing about the record that is not in the screen note
  - The reply is about the failed run and names the stored failure reason only if the note carries it
- id: screen_mind_beliefs_en
  description: 'Mind: two beliefs are selected'
  setup:
  - kind: fact
    name: f1
    fields:
      value: Ana prefers calls
  - kind: fact
    name: f2
    fields:
      value: Ana prefers email
  turns:
  - prompt: Do these two contradict each other?
    context:
      place: mind
      route: /mind
      origin: ask_bar
      selection:
      - kind: fact
        id: '{{f1.id}}'
        label: Ana prefers calls
        component: claim_card
      - kind: fact
        id: '{{f2.id}}'
        label: Ana prefers email
        component: claim_card
  expected_agent: companion
  tags:
  - screen_context
  - deixis
  - mind
  criteria:
  - about the referenced record, not a generic answer
  - does not ask which one the user means
  - does not describe the screen back to the user
  - states nothing about the record that is not in the screen note
  - The reply compares the two selected beliefs
