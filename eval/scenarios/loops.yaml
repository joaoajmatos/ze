- id: loops_track_twice_no_duplicate
  description: "Multi-turn: the same ask twice must reinforce the existing loop, not create a second one"
  turns:
    - prompt: "I haven't decided about the Porto move yet, keep it on my radar"
      description: "Turn 1: first ask"
    - prompt: "keep the Porto move on my radar please"
      description: "Turn 2: same ask again"
  expected_agent: loops
  verify:
    - table: open_loops
      where: {title__icontains: porto}
      expect: exists
      cleanup: true
  tags: [routing, loops, memory_honesty]
  criteria:
    - Turn 1 should say the Porto move is now tracked
    - Turn 2 should say it is already on the radar, not that it was newly created
    - Turn 2 should not claim a second loop was created

- id: loops-whats-open-en
  description: "Ask what is still open. Any speaker may answer; the judge checks the reply lists open items or says nothing is open."
  prompt: "What's still on my plate?"
  tags: [loops, executive, phase-171]
  criteria:
    - The reply either lists open items (loops, goals, workflows) or says plainly that nothing is open
    - It does not answer a different question (opening hours, files)

