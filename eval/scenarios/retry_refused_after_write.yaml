- id: retry_rollback_offered_after_reminder
  prompt: "Remind me tomorrow at 5pm to call Ana."
  description: >
    A turn that sets a reminder. Phase 180 keeps Retry available: set_reminder
    returns an undo payload, so Retry can cancel the reminder first and then
    regenerate the reply.
  expected_agent: reminders
  expected_tools: [set_reminder]
  tags: [retry, rollback]
  criteria:
    - Should route to the reminders agent and call set_reminder once
    - Should confirm the reminder time and label
    - The trace should record set_reminder with an undo payload, so Retry is available with a one-entry rollback plan

- id: retry_refused_after_goal
  prompt: "Create a goal to learn basic Portuguese in the next three months."
  description: >
    A turn that proposes a goal. Goal creation waits for the Start confirmation, but the trace records create_goal as a write call, so Retry must stay unavailable.
  expected_tools:
    # Goal creation waits for the user's Start confirmation, so the eval turn
    # may record a parked call (gate parked) rather than an executed one.
    - name: create_goal
      allow_parked: true
  tags: [retry, feedback]
  criteria:
    - Should create the goal through the goal tool, not just describe one
    - Should not repeat or duplicate the goal in the same reply
    - Retry is unavailable while the goal waits for Start (turn pending)
