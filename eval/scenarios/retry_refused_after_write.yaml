- id: retry_refused_after_reminder
  prompt: "Remind me tomorrow at 5pm to call Ana."
  description: >
    A turn that sets a reminder. Phase 165 refuses Retry on this reply and says
    why: the reply set a reminder, which can be undone separately but is never
    repeated by Retry.
  expected_agent: reminders
  expected_tools: [set_reminder]
  tags: [retry, feedback]
  criteria:
    - Should route to the reminders agent and call set_reminder once
    - Should confirm the reminder time and label
    - The trace should record set_reminder as a write call with reversibility declared, so Retry is unavailable with reason has_reversible_action

- id: retry_refused_after_goal
  prompt: "Create a goal to learn basic Portuguese in the next three months."
  description: >
    A turn that creates a goal. Retry must stay unavailable because a write ran.
  expected_tools:
    # Goal creation waits for the user's Start confirmation, so the eval turn
    # records a draft (is_draft, success false) rather than an executed call.
    - name: create_goal
      allow_draft: true
  tags: [retry, feedback]
  criteria:
    - Should create the goal through the goal tool, not just describe one
    - Should not repeat or duplicate the goal in the same reply
    - The trace should record create_goal as a write call, so Retry is unavailable
