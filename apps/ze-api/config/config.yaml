# Ze structural config — secrets and deployment values live in .env

models:
  default: anthropic/claude-haiku-4-5
  overrides: {}
  embedding:        intfloat/multilingual-e5-base
  whisper:          openai/gpt-audio
  vision_caption:   google/gemini-flash-1.5

routing:
  # Framework defaults live in ze_agents.defaults (E5-measured 0.73 / 0.02).
  # YAML may repeat the same pair; omitting this block still uses those defaults.
  threshold: 0.73
  gap_threshold: 0.02

# Typed judgments (Jev via OpenRouter System One). 163 speech-act, 164 routing (167-calibrated) and 166 skills are on.
system_one:
  enabled: true
  model: typesafe/jev-1.13
  timeout_ms: 2000
  surfaces:
    speech_act:
      enabled: true
      # Calibrated 2026-10-09 (make calibrate-speech-act, 60 EN+PT rows): exact-act 0.967,
      # fact precision 1.00 / recall 0.93, ECE 0.036. Flat region 0.5-0.9 x 0.5-0.75; mid-region chosen for margin.
      choice_hold: 0.9
      biography_hold: 0.7
    routing:
      enabled: true
      # Calibrated 2026-10-12 (167, k=9, 52 held-out EN+PT rows): zero harmful trusts and zero research->companion
      # misses on routing_holdout and routing_holdout2, ECE 0.080 / 0.013. Raw EN accuracy 0.90 on routing_holdout
      # (ho-loops-en: loops->companion at confidence 0.29, never trusted at 0.5, falls back to decompose).
      choice_trust: 0.5
      multi_specialist_hold: 0.5
      complexity_lookup_max: null   # suggestion 0.16/0.17 per set but 0.02 combined (outlier); regex tiering stays
      shortlist_k: 9                # 167 recall gate: smallest k with recall >= 0.95 on all three sets (0.571 at k=6 on holdout2)
    skills:
      enabled: true
      # Calibrated 2026-10-12 (make calibrate-skills, 84 EN+PT rows): Choice 0.978 EN / 0.970 PT, ECE 0.015,
      # zero wrong applies across the grid. Mid safe region chosen for margin (63 correct, 0 wrong, 0 missed).
      choice_trust: 0.75
      needs_skill_hold: 0.6
      shortlist_k: 5            # live recall 0.985 at k=5 (k=4 already meets 0.95)
      shortlist_floor: 0.35     # non-binding on the calibration roster (E5 cosines 0.71-0.89)
    loop_gate:
      enabled: true
      # Calibrated 2026-10-12 (make calibrate-loop-gate; 88 tuned + 48 held-out rows, EN+PT). Held-out verdict ENABLE for
      # EN and PT: recall 10/10 each, precision 1.00, zero false creates. Haiku baseline (same prompt, fence-tolerant)
      # EN 9/10 recall, 1 false create; PT 10/10, 1 false create. The 109 gate failed on every reply (fenced JSON) until its parse was fixed after the verdict.
      loop_hold: 0.75
      explicit_hold: 0.85
      resolves_hold: 0.8
    corroboration:
      # Phase 172: same-concern Noul for suspected-loop corroboration. Off with null bars until make calibrate-corroboration gives ENABLE on the held-out set.
      # Calibrated 2026-10-15 (make calibrate-corroboration; 84 tuned + 47 held-out rows, EN+PT). Held-out verdict KEEP OFF with
      # bars 0.6 / 0.8: EN ENABLE (P 1.00, R 14/14, zero false promotions), PT failed one clause: recall 12/13 = 0.923 < E5 1.000 - 0.05.
      # The E5 title-cosine baseline matches every row at 0.75 (P 0.57, R 1.00), so its recall is a ceiling, not a rival.
      # Candidate bars once a new held-out file exists: corroborate_hold 0.6, promote_hold 0.8.
      enabled: false
      corroborate_hold: null
      promote_hold: null

# Opt-in spend ceiling, token-estimated in real time inside preflight.
# Absent/null limits = current (telemetry-only) behavior, zero change.
budget:
  session_limit_usd: null    # e.g. 2.00
  daily_limit_usd: null      # e.g. 10.00

memory:
  nli_contradiction_threshold: 0.60
  nli_entailment_threshold: 0.70
  nli_lower_cosine_bound: 0.60
  nli_write_time_check: true
  nli_grounding_threshold: 0.30
  nli_retrieval_rerank: true
  nli_rerank_candidate_multiplier: 2
  nli_rerank_min_candidates: 5
  relevance_floor: 0.35            # global default; 0 recovers pre-phase-106 ANN-order behaviour (FR-017)
  relevance_floor_overrides:
    episode: 0.30
  composite_weights:
    similarity: 0.6
    recency: 0.25
    confidence: 0.15
  entity_anchor:
    enabled: true
    match_constant: 0.75
  live_rerank:
    enabled: true
    candidate_limit: 20
    timeout_ms: 120
  consolidation:
    episode_archive_days: 7
    episode_archive_batch: 50
    session_grouping_enabled: true
    min_session_episodes: 3
    max_sessions_per_run: 10
  graph:
    enabled: true
    max_hops: 1
    max_relationships: 20
  signals:
    enabled: true
    retention_days: 90
    force_ingest_sources: []   # e.g. ["news"] to bypass admission gate in dev

contacts:
  consolidation:
    episode_batch_size: 10
    max_episodes_per_run: 50
    nightly_cron: "0 3 * * *"
    review_cron: "30 8 * * *"
  follow_up:
    stale_days: 7
    max_nudges: 3

onboarding:
  enabled: true
  auto_start_on_empty_profile: true

skills:
  match_threshold: 0.5   # relevance floor for automatic /-less skill matching (US2)
  require_review: true
  reset:
    allow_full_dev_from_app: false
  recheck:
    enabled: true
    cron: "0 6 * * *"    # daily source-content recheck (US4)

proactive:
  briefing:
    enabled: true
    cron: "0 8 * * *"
    unreviewed_nudge_threshold: 5
    catch_up_max_age_hours: 6      # a missed briefing is skipped once it is this old
  alerts:
    workflow_failure_enabled: true
    workflow_failure_cooldown_hours: 1
  calendar:
    sync_enabled: true
    sync_cron: "45 7 * * *"
    sync_days_ahead: 7
  insights:
    enabled: true
    cron: "0 7 * * 0"
    lookback_days: 7
    min_evidence: 3
    max_per_run: 3
    category_cooldown_days: 7
  goal_narrative:
    enabled: true
    cron: "0 18 * * 0"
  goal_suggestion:
    enabled: true
    cron: "0 19 * * 0"
  stuck_goals:
    enabled: true
    cron: "0 9 * * 2"
  accountability:
    enabled: true
    schedule: "0 9 * * 1"          # Monday 09:00 weekly narrative
    cost_anomaly_schedule: "0 */6 * * *"  # every 6 hours
    anomaly_threshold: 4.0          # multiplier above baseline to alert
    anomaly_min_samples: 5          # min historical runs to establish baseline
    anomaly_retention_days: 30      # how long to keep anomaly records
    stall_days: 3                   # milestone idle days before counted as stalled
  budget:
    max_pushes_per_day: 5          # shared by every discretionary push (phase 177)
  attention_arbitration:
    enabled: true
    cron: "0 */4 * * *"

correlation:
  inline:
    enabled: true
    timeout_ms: 1500
    max_connections_shown: 2
    agents: ["research", "news"]
  engine:
    enabled: true
    max_hops_inline: 1
    max_hops_proactive: 2
    neighbourhood_limit_inline: 15
    neighbourhood_limit_proactive: 30
    max_seeds_inline: 5
    timeout_seconds_inline: 5
    model: "anthropic/claude-haiku-4-5"
  push:
    enabled: false              # off by default until Phase 58 inline is trusted
    schedule: "0 */4 * * *"
    max_seeds_per_run: 20
    seed_lookback_hours: 8      # look back slightly more than the cron interval
    dry_run: true               # log would-be pushes during calibration; set false to go live
    # `enabled` and `dry_run` are honored by the attention-arbitration push path
    # (phase 170): disabled yields no candidates; dry-run logs them and sends none.
  salience:
    dry_run: false             # true → log admission decisions without writing to graph
    admission:
      tau_admit: 0.55
      tau_watch: 0.35
      w_relevance: 0.7
      w_magnitude: 0.3
      watch_buffer_ttl_hours: 48
    surfacing:
      tau_push: 0.6            # interrupt bar (proactive push, Phase 59 — deferred)
      tau_inline: 0.45         # low bar (inline section, Phase 58 — v1); must be < tau_push
      tau_relevance: 0.5
      novelty_similarity_max: 0.85
    relevance:
      episode_lookback_days: 30
      cache_ttl_minutes: 30

worldstate:
  drift:
    enabled: true
    cron: "0 5 * * *"
  push:
    enabled: true
    inline_cooldown_hours: 12
    thresholds:
      tau_confidence: 0.5
      tau_relevance: 0.5
      novelty_similarity_max: 0.85
      grounding_threshold: 0.3   # matches the code default; was 0.5 and unread

news:
  enabled: true
  fetch_schedule: "*/30 * * * *"
  min_fetch_interval_minutes: 30
  retention_days: 7
  model: "openai/gpt-4o-mini"
  briefing_limit: 8
  personalization:
    enabled: true
    explore_ratio: 0.2
    min_preferences: 2
    max_per_topic: 2
    candidate_multiplier: 4
    fact_days: 365
    fact_limit: 100
    min_confidence: 0.65
    briefing_limit: 8
    min_facts: 5
  credibility:
    enabled: true
    llm_scoring: true
    model: "openai/gpt-4o-mini"
    flag_in_briefing: true
    briefing_summary: true
  nli_credibility_enabled: false
  nli_headline_contradiction_threshold: 0.50
  nli_headline_entailment_threshold: 0.30
  nli_dedup_enabled: false
  nli_dedup_cosine_threshold: 0.75
  nli_dedup_entailment_threshold: 0.70
  sources:
    - key: bbc_world
      type: rss
      url: "https://feeds.bbci.co.uk/news/world/rss.xml"
      tags: [global, general]
    - key: bbc_tech
      type: rss
      url: "https://feeds.bbci.co.uk/news/technology/rss.xml"
      tags: [global, tech]
    - key: hn
      type: rss
      url: "https://hnrss.org/frontpage"
      tags: [global, tech, hacker-news]
    - key: jornal_leiria
      type: rss
      url: "https://www.jornaldeleiria.pt/rss-feed"
      tags: [local, pt, leiria]
    - key: regiao_leiria
      type: rss
      url: "https://www.regiaodeleiria.pt/feed/"
      tags: [local, pt, leiria]
    - key: dn
      type: rss
      url: "https://www.dn.pt/feed/"
      tags: [local, pt, national]
    - key: observador
      type: rss
      url: "https://observador.pt/feed/"
      tags: [local, pt, national]

finance:
  snapshot_schedule: "0 8 * * *"
  large_transaction_threshold: 500
  llm_categorization: false
  nli_merchant_merge_enabled: false
  nli_merchant_cosine_threshold: 0.70
  nli_merchant_entailment_threshold: 0.70

dream:
  enabled: true
  cron: "0 3 * * *"
  max_replay_episodes: 100
  max_synthesis_per_run: 20
  max_stress_tests_per_goal: 2
  max_schema_candidates_per_run: 30
  session_archive_threshold_days: 7
  auto_promote_min_support: 3
  auto_promote_min_distinct_sessions: 2
  auto_promote_min_temporal_spread_days: 7
  auto_promote_max_user_asserted: 1
  nli_groundedness_threshold: 0.75
  novelty_similarity_threshold: 0.92
  decay_cycles: 5
  decay_rate: 0.1
  forgetting_weight_threshold: 0.1
  synthesis_model: "anthropic/claude-haiku-4-5"
  critic_model: "anthropic/claude-sonnet-4-6"
  synthetic_fact_valid_days: 90
  job_timeout_seconds: 1800
  review_notifications_enabled: false  # enable when React review page ships
  inactivity_trigger_enabled: false    # fire dream job when idle for N hours (no run since last session)
  inactivity_threshold_hours: 6
  inactivity_check_interval_minutes: 30

# Durable workspace sidecar (files + shell). Secrets stay in .env.
workspace:
  run_timeout_seconds: 120
  output_preview_chars: 8000
  storage_ceiling_bytes: 1073741824
  run_lock_wait_seconds: 30
  follow_through_short_wait_seconds: 25