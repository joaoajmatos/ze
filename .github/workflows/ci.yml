name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Gate steps run even when an earlier gate fails, so one red run shows every
# broken gate instead of only the first.
jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make typecheck-web

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make lint-web

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make web-build

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make test-web

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        id: install
        run: uv sync

      - name: Ruff
        run: make lint

      - name: Pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make test-py
